#!KAMAILIO
#
# SamvadX SIP gateway: agents' browsers (SIP over secure WebSocket, via nginx) <-> SkyCRM's call
# system (plain SIP over UDP, reached through the tunnel: openfortivpn while testing, IPsec in
# production). See README.md.
#
# - REGISTER: forwarded to SkyCRM with the Contact rewritten to this gateway, so SkyCRM rings the
#   gateway and the gateway hands the call to the right browser (kept in memory, by extension).
# - Calls: Kamailio relays signalling; rtpengine converts browser audio (ICE + DTLS-SRTP) to
#   plain RTP for SkyCRM and back.
# - Nothing here authenticates agents: SkyCRM's own digest challenge does, end to end.
#
# Values in UPPER_CASE come from gateway-local.cfg, written by setup.sh / tunnel-up.sh.

#!include_file "/etc/kamailio/gateway-local.cfg"

####### Global parameters #########

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

children=4
tcp_children=4
auto_aliases=no
dns=no
rev_dns=no

# WebSocket frames from nginx arrive over plain TCP on localhost.
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_keepalive=yes

# SkyCRM side: only over the tunnel.
listen=udp:TUNNEL_IP:5060
# Browser side: nginx terminates TLS for wss://DOMAIN/ws and passes the WebSocket here.
listen=tcp:127.0.0.1:WS_PORT

####### Modules ########

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

modparam("jsonrpcs", "pretty_format", 1)

# Two Record-Routes when a call crosses from WebSocket to UDP, so each side routes back correctly.
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)

# Registrations live in memory only, keyed by extension (extensions are unique platform-wide).
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)
modparam("registrar", "gruu_enabled", 0)
modparam("nathelper|registrar", "received_avp", "$avp(RECEIVED)")

modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_interval", 30)

# Media flags. "internal" = tunnel side (SkyCRM), "external" = internet side (browsers).
#!substdef "!TO_SKYCRM!direction=external direction=internal trust-address replace-origin replace-session-connection ICE=remove RTP/AVP SDES-off rtcp-mux-demux!g"
#!substdef "!TO_BROWSER!direction=internal direction=external trust-address replace-origin replace-session-connection ICE=force RTP/SAVPF SDES-off rtcp-mux-require generate-mid!g"

####### Routing logic ########

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check()) {
		exit;
	}

	# $var is per process and survives between messages: always set it.
	if ($proto == "ws" || $proto == "wss") {
		$var(from_browser) = 1;
	} else {
		# Over UDP, only SkyCRM's call system may talk to us.
		if ($si != "PBX_IP") {
			exit;
		}
		$var(from_browser) = 0;
	}

	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "OK");
		exit;
	}

	# SkyCRM checks each registered extension with OPTIONS (qualify). Answer for the browser
	# while it is registered here: a missed check makes SkyCRM mark the extension Unavailable and
	# never ring it (seen 2026-11-03).
	if ($var(from_browser) == 0 && is_method("OPTIONS") && !has_totag()) {
		if (registered("location")) {
			sl_send_reply("200", "OK");
		} else {
			sl_send_reply("404", "Not Found");
		}
		exit;
	}

	if ($var(from_browser) == 1) {
		force_rport();
		if (!is_method("REGISTER")) {
			# Lets SkyCRM's in-dialog requests find their way back to this WebSocket.
			add_contact_alias();
		}
	}

	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			t_relay();
		}
		exit;
	}
	t_check_trans();

	remove_hf("Route");

	if (is_method("REGISTER")) {
		route(REGISTER);
		exit;
	}

	if (!is_method("INVITE|MESSAGE|OPTIONS|INFO|NOTIFY")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	if (is_method("INVITE")) {
		record_route();
	}

	if ($var(from_browser) == 1) {
		# Browser -> SkyCRM. Never anywhere else: this is not an open relay.
		$du = "sip:PBX_IP:PBX_PORT";
	} else {
		# SkyCRM -> the browser registered for this extension.
		lookup("location");
		switch ($rc) {
			case -1:
			case -3:
				sl_send_reply("404", "Not Found");
				exit;
			case -2:
				sl_send_reply("405", "Method Not Allowed");
				exit;
		}
	}
	route(RELAY);
}

route[RELAY] {
	if (is_method("INVITE|BYE|CANCEL")) {
		xlog("L_INFO", "relay $rm from $proto:$si to $ru ($du)\n");
	}
	if (is_method("INVITE|UPDATE|ACK|BYE|CANCEL")) {
		route(MEDIA);
	}
	if (is_method("INVITE|UPDATE")) {
		t_on_reply("REPLY");
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

route[MEDIA] {
	if (is_method("BYE|CANCEL")) {
		rtpengine_delete();
		return;
	}
	if (!has_body("application/sdp")) {
		return;
	}
	if ($var(from_browser) == 1) {
		rtpengine_manage("TO_SKYCRM");
	} else {
		rtpengine_manage("TO_BROWSER");
	}
}

route[WITHINDLG] {
	if (loose_route()) {
		if ($var(from_browser) == 0) {
			# Toward the browser: resolve the alias added to its Contact.
			handle_ruri_alias();
		}
		route(RELAY);
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			t_relay();
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

# The browser registers its extension: remember which WebSocket it is on, then register the
# extension at SkyCRM with this gateway as the contact.
route[REGISTER] {
	if ($var(from_browser) == 0) {
		sl_send_reply("403", "Forbidden");
		exit;
	}

	$avp(browser_contact) = $ct;

	if ($ct == "*") {
		$var(expires) = 0;
	} else {
		$var(expires) = $(ct{re.subst,/^.*;[ ]*expires=([0-9]+).*$/\1/});
		if (!($var(expires) =~ "^[0-9]+$")) {
			if (is_present_hf("Expires")) {
				$var(expires) = $hdr(Expires);
			} else {
				$var(expires) = "600";
			}
		}
	}

	fix_nated_register();
	if (!save("location", "0x02")) {
		xlog("L_WARN", "could not store registration for $tU\n");
	}

	if ($ct != "*") {
		remove_hf("Contact");
		append_hf("Contact: <sip:$tU@TUNNEL_IP:5060>;expires=$var(expires)\r\n");
	}

	$du = "sip:PBX_IP:PBX_PORT";
	t_on_reply("REGISTER_REPLY");
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# SkyCRM's 200 OK lists the gateway's contact; the browser expects to see its own. Keep
# SkyCRM's granted expiry, though: it caps registrations at 60 s, and a browser told its own
# 600 s would re-register far too late and look Unavailable to SkyCRM in between.
onreply_route[REGISTER_REPLY] {
	if (status =~ "^2[0-9][0-9]$" && $avp(browser_contact) != "*") {
		$var(granted) = $(ct{re.subst,/^.*;[ ]*expires=([0-9]+).*$/\1/});
		if (!($var(granted) =~ "^[0-9]+$")) {
			$var(granted) = $hdr(Expires);
		}
		$var(bc) = $(avp(browser_contact){re.subst,/;[ ]*expires=[0-9]+//g});
		remove_hf("Contact");
		if ($var(granted) =~ "^[0-9]+$") {
			append_hf("Contact: $var(bc);expires=$var(granted)\r\n");
		} else {
			append_hf("Contact: $avp(browser_contact)\r\n");
		}
	}
}

onreply_route[REPLY] {
	xlog("L_INFO", "reply $rs $rr for $rm via $proto:$si\n");
	if ($proto == "ws" || $proto == "wss") {
		if (is_method("INVITE")) {
			add_contact_alias();
		}
		if (has_body("application/sdp")) {
			rtpengine_manage("TO_SKYCRM");
		}
	} else if (has_body("application/sdp")) {
		rtpengine_manage("TO_BROWSER");
	}
}

####### WebSocket handshake (from nginx) ########

event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();

	if ($Rp != WS_PORT) {
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}

	if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
		# Only SamvadX pages may open a phone connection.
		if (!($hdr(Origin) =~ ALLOWED_ORIGINS)) {
			xlog("L_WARN", "websocket refused from origin $hdr(Origin)\n");
			xhttp_reply("403", "Forbidden", "", "");
			exit;
		}
		if (ws_handle_handshake()) {
			exit;
		}
	}

	xhttp_reply("404", "Not Found", "", "");
}

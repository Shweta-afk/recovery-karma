# nginx site for the gateway: TLS for wss://__DOMAIN__/ws, passed to Kamailio on localhost
# (softphone route), and wss://__DOMAIN__/skycrm-ws when enable-skycrm-webrtc.sh has run.
# setup.sh replaces __DOMAIN__ and __WS_PORT__; certbot adds the certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ws {
        proxy_pass http://127.0.0.1:__WS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A registered phone sits idle between calls; keep the socket open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Option B (2026-11-04): /skycrm-ws, passed through to SkyCRM's own WebRTC. Written by
    # enable-skycrm-webrtc.sh; absent (and harmless) until that script has run.
    include /etc/nginx/samvadx-gateway.d/*.conf;

    location = /health {
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
